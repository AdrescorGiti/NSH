<svg xmlns="http://www.w3.org/2000/svg" width="952" height="533" viewBox="0 0 952 533" xml:lang="en" role="img" aria-labelledby="title description">
<title id="title">Shell benchmarks</title>
<desc id="description">Median wall-clock time per workload (ms). Lower is faster. CachyOS · x86_64 · 2026-11-15 UTC. NSH 0.2.1, Dash 0.5.13.6, Zsh 5.9.2, Fish 4.9.3, Bash 5.3.20. Warm startup — NSH 1.733 ms, Dash 1.536 ms, Zsh 1.911 ms, Fish 2.338 ms, Bash 1.882 ms. Cold executable pages — NSH 3.811 ms, Dash 2.026 ms, Zsh 3.192 ms, Fish 9.279 ms, Bash 3.145 ms. 2,000 true builtins — NSH 2.361 ms, Dash 1.904 ms, Zsh 3.802 ms, Fish 4.879 ms, Bash 2.737 ms. 800 printf calls — NSH 3.494 ms, Dash 2.725 ms, Zsh 5.195 ms, Fish 5.811 ms, Bash 4.234 ms. 1,600 function calls — NSH 4.107 ms, Dash 3.762 ms, Zsh 12.102 ms, Fish 13.872 ms, Bash 9.368 ms. Multiline block · 1,200 true calls — NSH 2.563 ms, Dash 1.818 ms, Zsh 2.988 ms, Fish 3.985 ms, Bash 2.934 ms. 16 MiB pipeline — NSH 5.718 ms, Dash 5.554 ms, Zsh 5.935 ms, Fish 6.224 ms, Bash 5.915 ms. 100 /usr/bin/true processes — NSH 27.350 ms, Dash 19.106 ms, Zsh 32.368 ms, Fish 21.767 ms, Bash 28.763 ms. 100 cat processes via PATH — NSH 39.492 ms, Dash 29.756 ms, Zsh 44.202 ms, Fish 33.231 ms, Bash 39.674 ms.</desc>

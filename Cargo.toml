[package]
name = "nsh"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "NSH — Neo SH. Just Vanilla SH."
repository = "https://github.com/AdrescorGiti/NSH"

[dependencies]
libc = "0.2"
mlua = { version = "=0.11.6", features = ["lua54", "vendored"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "=0.9.8", default-features = false, features = ["std", "serde", "parse"] }
unicode-segmentation = "=1.12.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
